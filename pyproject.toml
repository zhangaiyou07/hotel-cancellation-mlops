[project]
name = "hotel-cancellation-mlops"
version = "0.1.0"
description = "End-to-end MLOps system for predicting hotel booking cancellations (INSY 684)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (unused imports, undefined names), I = import order, B = common bugs
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
